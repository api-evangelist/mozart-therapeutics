aid: mozart-therapeutics
name: Mozart Therapeutics
description: >-
  Mozart Therapeutics, Inc. is a privately held, clinical-stage biopharmaceutical company in
  Seattle, Washington, founded in 2020 to develop disease-modifying therapies for autoimmune and
  inflammatory disease. Its platform is built on the regulatory CD8 T cell (CD8 Treg) network — an
  upstream immune checkpoint that normally recognizes and eliminates the pathogenic immune cells
  that attack healthy tissue, and that becomes dysfunctional in autoimmune disease when inhibitory
  killer immunoglobulin-like receptors (KIR) block CD8 Treg activation. Rather than suppressing
  downstream inflammation, Mozart engineers bispecific CD8 Treg modulators intended to restore that
  checkpoint and re-establish long-term immune balance. Its pipeline comprises MTX-101, a KIR x CD8
  bispecific antibody in Phase 1b study for type 1 diabetes, and MTX-201, a KIR x ICOS bispecific
  in preclinical development for inflammatory bowel disease. The company launched with a $55M
  Series A led by ARCH Venture Partners and Sofinnova Partners with participation from Eli Lilly,
  MRL Ventures Fund, Leaps by Bayer, Altitude Life Science Ventures and Alexandria Venture
  Investments, and later added a $25M extension including Pfizer Ventures, AbbVie Ventures, Ono
  Venture Investment and UPMC Enterprises. Mozart Therapeutics sells therapeutics, not software: it
  runs no developer program, publishes no API, SDK or machine-readable specification, and maintains
  no public source-code organization.
